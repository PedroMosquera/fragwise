[project]
name = "fragwise-api"
version = "0.0.0"
description = "Fragwise FastAPI service with LangGraph agent."
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.128.0,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "langgraph~=1.0.8",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "sqlalchemy[asyncio]>=2.0.40,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "pgvector>=0.4,<1.0",
    "pydantic>=2.10,<3.0",
    "pyyaml>=6.0,<7.0",
    "openai>=1.55,<3.0",
    "tenacity>=9.0,<10.0",
    "uuid-utils>=0.10,<1.0",
    "python-slugify>=8.0,<9.0",
]

[project.optional-dependencies]
# Empty in 0c.

[dependency-groups]
dev = [
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "anyio>=4.6,<5.0",
    "testcontainers[postgres]>=4.9,<5.0",
    "types-pyyaml>=6.0,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fragwise_api"]

[tool.uv]
required-version = ">=0.5"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W", "N", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = []

[[tool.mypy.overrides]]
module = ["langgraph.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers -m 'not integration'"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires Docker; opt-in via -m integration",
]
