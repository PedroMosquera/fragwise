name: web

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/openapi.json"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/openapi.json"
      - ".github/workflows/web.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup uv (for OpenAPI re-emit)
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.9"

      - name: Install workspace
        working-directory: .
        run: pnpm install --frozen-lockfile

      # S2 fix: re-emit upstream OpenAPI so a stale apps/api/openapi.json
      # cannot make the types-stale check pass on a phantom contract.
      - name: Re-emit OpenAPI and check upstream stale
        working-directory: .
        run: |
          uv run --project apps/api python apps/api/scripts/emit_openapi.py
          if ! git diff --exit-code apps/api/openapi.json; then
            echo "::error::apps/api/openapi.json is stale. Run 'just emit-openapi' and commit."
            exit 1
          fi

      - name: Generate API types and check stale
        run: |
          pnpm run generate-api-types
          if ! git diff --exit-code lib/api/types.ts; then
            echo "::error::apps/web/lib/api/types.ts is stale. Run 'just generate-types' and commit."
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm exec next build

      - name: Bundle budget
        run: pnpm exec size-limit
